name: Sync All in UJ → kalendarz (.ics)

on:
  schedule:
    # Co 6 h: 05:17, 11:17, 17:17 i 23:17 UTC (zimą w Krakowie 6:17, 12:17, 18:17 i 0:17).
    # GitHub czasem pomija zaplanowane przebiegi, więc częstsze uruchomienia to zapas.
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Wyślij mail testowy (sprawdzenie powiadomień)'
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit stanu (data/events.json)
    outputs:
      has_feed: ${{ steps.feed.outputs.ok }}
    steps:
      # Zawsze najnowszy main, a nie commit, od którego wystartował przebieg:
      # „Re-run” na GitHubie używa starego SHA, przez co push stanu był odrzucany.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Pobierz wydarzenia i zbuduj .ics
        id: sync
        continue-on-error: true # nawet przy częściowym błędzie publikujemy to, co się udało
        run: npm run sync
        env:
          FB_PAGE_URL: ${{ vars.FB_PAGE_URL }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          # Powiadomienia e-mail o nowych wydarzeniach (wyłączone, dopóki nie ma SMTP_USER i SMTP_PASS)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NOTIFY_TEST: ${{ inputs.test_email }}
          # Opcjonalnie: dodatkowy zapis przez Google Calendar API
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Czy powstał plik kalendarza?
        id: feed
        if: ${{ !cancelled() }}
        run: |
          if [ -f public/allinuj.ics ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() && steps.feed.outputs.ok == 'true' }}
        with:
          path: public

      - name: Zapisz stan w repo
        if: ${{ !cancelled() && steps.feed.outputs.ok == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja wydarzeń All in UJ"
          elif [ "$(git log -1 --format=%ct)" -lt "$(date -d '30 days ago' +%s)" ]; then
            # GitHub wyłącza crony w publicznych repo po 60 dniach bez aktywności (np. w wakacje).
            git commit --allow-empty -m "keepalive"
          fi
          # Gdyby w trakcie przebiegu ktoś wypchnął zmiany w kodzie, dołącz je przed pushem.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"

      - name: Zgłoś błąd synchronizacji
        if: ${{ !cancelled() && steps.sync.outcome == 'failure' }}
        run: |
          echo "::error::Synchronizacja z FB nie powiodła się (szczegóły w kroku 'Pobierz wydarzenia')."
          exit 1

  # Osobny job (oficjalny wzorzec GitHuba): artefakt z kalendarzem jest już wtedy na pewno widoczny.
  # Publikuje nawet wtedy, gdy job sync skończył się błędem, o ile plik kalendarza powstał.
  deploy:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.has_feed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
